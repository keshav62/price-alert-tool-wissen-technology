
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-alert-tool"
version = "0.1.0"
description = "Price Alert Tool — Wissen Technology Campus Assessment"
requires-python = ">=3.10"

[project.scripts]
price-alert = "price_alert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
